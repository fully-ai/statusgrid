name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -race -v ./...
      - run: go build ./cmd/statusgrid-server && go build ./cmd/statusgrid-probe

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -t statusgrid:ci .
