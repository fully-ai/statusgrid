services:
  statusgrid-server:
    build: .
    container_name: statusgrid-server
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      STATUSGRID_ADDR: "0.0.0.0:8094"
      STATUSGRID_DATA_DIR: "/data"
      STATUSGRID_ADMIN_TOKEN: "${STATUSGRID_ADMIN_TOKEN:-change-me-admin}"
      STATUSGRID_PROBE_TOKEN: "${STATUSGRID_PROBE_TOKEN:-change-me-probe}"
    volumes:
      - statusgrid_data:/data
    restart: unless-stopped

  statusgrid-probe:
    build: .
    container_name: statusgrid-probe
    entrypoint: ["statusgrid-probe"]
    command: ["-server", "http://statusgrid-server:8094", "-region", "eu-central", "-interval", "15s"]
    environment:
      STATUSGRID_PROBE_TOKEN: "${STATUSGRID_PROBE_TOKEN:-change-me-probe}"
    depends_on:
      - statusgrid-server
    restart: unless-stopped

volumes:
  statusgrid_data:
